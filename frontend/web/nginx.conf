server {
  listen 80;
  server_name short-and-long.ru www.short-and-long.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name short-and-long.ru www.short-and-long.ru;

  ssl_certificate /etc/ssl/short-and-long/cert.pem;
  ssl_certificate_key /etc/ssl/short-and-long/key.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; font-src 'self' data:; connect-src 'self' https: wss: https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://s.tradingview.com https://www.tradingview.com; frame-ancestors 'none'; base-uri 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ~* ^/(?:\.|.*\.(?:sql|yml|yaml|env|ini|bak|old|log)|docker-compose\.ya?ml|wp-config\.php|\.git/|\.ht|\.env|\.pgpass|\.netrc) {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://10.20.0.2:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/telegram/webhook {
    proxy_pass http://10.20.0.2:8080/telegram/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://10.20.0.2:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /telegram/webhook {
    proxy_pass http://10.20.0.2:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}