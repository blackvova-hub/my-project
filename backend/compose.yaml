      LIQ_DEBUG: "${LIQ_DEBUG:-0}"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      COMPACT_REDIS_STREAM: "candles:v3:binance:perpetual"
