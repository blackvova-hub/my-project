name: dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: alerts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:5435:5432"
    volumes:
      - /mnt/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alerts"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    logging: *default-logging
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 10gb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 3s
      timeout: 3s
      retries: 60

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
      additional_contexts:
        backtest: ./backtest
    container_name: crypto_backend
    logging: *default-logging
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/alerts?sslmode=disable"
      CORS_ORIGIN: "https://short-and-long.ru"
      COOKIE_SECURE: "true"
      HSTS_MAX_AGE: "31536000"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      REDIS_DB: "0"
      BYBIT_BASE_URL: "https://api.bybit.com"
      BINANCE_SPOT_BASE_URL: "https://api.binance.com"
      BINANCE_FUTURES_BASE_URL: "https://fapi.binance.com"
      SKIP_MIGRATIONS: "0"
      APP_ENV: "${APP_ENV:-production}"
      FRONTEND_URL: "${FRONTEND_URL}"
      RESET_TOKEN_SECRET: "${RESET_TOKEN_SECRET}"
      ANALYTICS_ENCRYPTION_KEY: "${ANALYTICS_ENCRYPTION_KEY:-}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-10.20.0.2/32,172.16.0.0/12}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
      # Production/default mode: Telegram delivers updates to the HTTPS webhook.
      TELEGRAM_POLLING_ENABLED: "false"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET}"
      TURNSTILE_ENABLED: "${TURNSTILE_ENABLED}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4-mini}"
      OPENAI_DAILY_TOKENS: "${OPENAI_DAILY_TOKENS:-150000}"
      SIMILARITY_URL: "http://similarity_worker:8092"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: backtest
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}"
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro
      - marketcache:/home/app/.cache/short-long
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: shortlong_backtest
      CLICKHOUSE_USER: backtest
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - backtest_candles:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  backtest_worker:
    build:
      context: ./backtest
    logging: *default-logging
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/alerts?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: backtest
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}"
      BYBIT_BASE_URL: "${BACKTEST_BYBIT_BASE_URL:-https://api.bybit.com}"
      BACKTEST_CONCURRENCY: "${BACKTEST_CONCURRENCY:-2}"
      MARKET_HISTORY_RPS: "${MARKET_HISTORY_RPS:-30}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  market_history:
    build:
      context: ./backtest
    command: ["/app/history-sync"]
    logging: *default-logging
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/alerts?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: backtest
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}"
      BYBIT_BASE_URL: "${BACKTEST_BYBIT_BASE_URL:-https://api.bybit.com}"
      MARKET_HISTORY_MARKETS: "${MARKET_HISTORY_MARKETS:-spot,linear}"
      MARKET_HISTORY_MONTHS: "${MARKET_HISTORY_MONTHS:-6}"
      MARKET_HISTORY_REFRESH_HOURS: "${MARKET_HISTORY_REFRESH_HOURS:-12}"
      MARKET_HISTORY_CONCURRENCY: "${MARKET_HISTORY_CONCURRENCY:-32}"
      MARKET_HISTORY_RPS: "${MARKET_HISTORY_RPS:-30}"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/app/history-sync", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.17.0
    cpus: "2.0"
    logging: *default-logging
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
      QDRANT__STORAGE__PERFORMANCE__OPTIMIZER_CPU_BUDGET: "2"
      QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS: "1"
      QDRANT__STORAGE__HNSW_INDEX__MAX_INDEXING_THREADS: "2"
    volumes:
      - similarity_vectors:/qdrant/storage
    restart: unless-stopped

  similarity_worker:
    cpus: "1.0"
    build:
      context: .
      dockerfile: similarity/Dockerfile
    logging: *default-logging
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/alerts?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: backtest
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}"
      SIMILARITY_WINDOWS: "${SIMILARITY_WINDOWS:-12:3,36:6,72:12,144:12,288:24,864:72,2016:144}"
      SIMILARITY_WEIGHTS: "${SIMILARITY_WEIGHTS:-[0.4,0.2,0.15,0.15,0.1]}"
      SIMILARITY_CONCURRENCY: "${SIMILARITY_CONCURRENCY:-1}"
      SIMILARITY_HOT_SYMBOLS: "${SIMILARITY_HOT_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}"
      SIMILARITY_CANDIDATES: "${SIMILARITY_CANDIDATES:-500}"
      BYBIT_BASE_URL: "${BACKTEST_BYBIT_BASE_URL:-https://api.bybit.com}"
      MARKET_HISTORY_RPS: "${MARKET_HISTORY_RPS:-30}"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/app/similarity", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      backend:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  scanner_bybit_shard0:
