      COMPACT_RETENTION_HOURS: "${COMPACT_RETENTION_HOURS:-26}"
      WORKERS: "24"
      RPS: "30"
      BURST: "60"
      TRADE_LIMIT: "1000"
      OI_INTERVAL: "5min"
      ORDERBOOK_ENABLED: "0"
      HTTP_TIMEOUT_SECONDS: "15"
      SYMBOLS_LOAD_TIMEOUT_SECONDS: "40"
      SYMBOLS_LOAD_RETRIES: "3"
      RUN_TIMEOUT_SECONDS: "55"
      CANDLE_SETTLE_DELAY_SECONDS: "5"
