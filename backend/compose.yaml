      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_slot3:
    build:
      context: ./workers/alert-engine
      dockerfile: Dockerfile
    container_name: crypto_worker_slot3
    logging: *default-logging
    environment:
      PG_DSN: "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/alerts?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      MARKET_STREAMS: "candles:v3:bybit:perpetual,candles:v3:binance:perpetual,liquidations:v3:okx:perpetual,liquidations:v3:bitget:perpetual,liquidations:v3:gateio:perpetual"
      MARKET_CONSUMER_GROUP: "alert-engine-slot3"
      RULES_SLOT_FILTER: "SLOT_3"
      CONSUMER_NAME: "worker-slot3"
      LOG_LEVEL: "info"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      ALERTS_STREAM_MAXLEN: "50000"
      STREAM_READ_COUNT: "${STREAM_READ_COUNT:-10}"
      SPARSE_MAX_INSTRUMENTS: "${SPARSE_MAX_INSTRUMENTS:-20000}"
      SPARSE_SNAPSHOT_PATH: "/app/state/slot3.snapshot"
      SPARSE_SNAPSHOT_EVERY_SECONDS: "${SPARSE_SNAPSHOT_EVERY_SECONDS:-300}"
      STREAM_MAX_DELIVERIES: "${STREAM_MAX_DELIVERIES:-5}"
      STREAM_DLQ_MAXLEN: "${STREAM_DLQ_MAXLEN:-10000}"
      STREAM_DLQ_RAW_MAX_BYTES: "${STREAM_DLQ_RAW_MAX_BYTES:-65536}"
      STREAM_DLQ_ERROR_MAX_BYTES: "${STREAM_DLQ_ERROR_MAX_BYTES:-2048}"
    volumes:
      - worker_state:/app/state
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  news_bot:
    build:
      context: ./news/collector
      dockerfile: Dockerfile
    container_name: crypto_news_bot
    restart: unless-stopped
    logging: *default-logging
    environment:
      PG_DSN: "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/alerts?sslmode=disable"
      NEWS_SOURCE_INTERVAL_MINUTES: "${NEWS_SOURCE_INTERVAL_MINUTES:-1}"
      NEWS_SOURCE_STAGGER_MINUTES: "${NEWS_SOURCE_STAGGER_MINUTES:-1}"
      NEWS_DEDUP_WINDOW_HOURS: "${NEWS_DEDUP_WINDOW_HOURS:-72}"
      CRYPTOPANIC_API_TOKEN: "${CRYPTOPANIC_API_TOKEN:-}"
      COINTELEGRAPH_ENABLED: "${COINTELEGRAPH_ENABLED:-1}"
      COINTELEGRAPH_RSS_URL: "${COINTELEGRAPH_RSS_URL:-https://cointelegraph.com/rss}"
      COINDESK_RSS_URL: "${COINDESK_RSS_URL:-https://www.coindesk.com/arc/outboundfeeds/rss/}"
      DECRYPT_RSS_URL: "${DECRYPT_RSS_URL:-https://decrypt.co/feed}"
      BYBIT_ANNOUNCEMENTS_ENABLED: "${BYBIT_ANNOUNCEMENTS_ENABLED:-1}"
      BYBIT_ANNOUNCEMENTS_API_URL: "${BYBIT_ANNOUNCEMENTS_API_URL:-https://api.bybit.com/v5/announcements/index?locale=en-US&limit=20}"
      SEC_RSS_ENABLED: "${SEC_RSS_ENABLED:-1}"
      SEC_EDGAR_ENABLED: "${SEC_EDGAR_ENABLED:-1}"
      SEC_COMPANY_CIKS: "${SEC_COMPANY_CIKS:-1679788,1050446,1876042,1783879}"
      FEDERAL_RESERVE_ENABLED: "${FEDERAL_RESERVE_ENABLED:-1}"
      WHITE_HOUSE_ENABLED: "${WHITE_HOUSE_ENABLED:-1}"
      WHITE_HOUSE_RSS_URL: "${WHITE_HOUSE_RSS_URL:-https://www.whitehouse.gov/briefing-room/feed/}"
      FEDERAL_REGISTER_ENABLED: "${FEDERAL_REGISTER_ENABLED:-1}"
      FEDERAL_REGISTER_API_URL: "${FEDERAL_REGISTER_API_URL:-https://www.federalregister.gov/api/v1/documents.json?per_page=20&order=newest&conditions%5Bpresidential_document_type%5D%5B%5D=executive_order}"
      UPBIT_ENABLED: "${UPBIT_ENABLED:-1}"
      BITHUMB_ENABLED: "${BITHUMB_ENABLED:-1}"
      SOSOVALUE_API_KEY: "${SOSOVALUE_API_KEY:-}"
      SOSOVALUE_ETF_ENABLED: "${SOSOVALUE_ETF_ENABLED:-0}"
      SOSOVALUE_ETF_INTERVAL: "${SOSOVALUE_ETF_INTERVAL:-30m}"
      FEAR_GREED_ENABLED: "${FEAR_GREED_ENABLED:-1}"
      FEAR_GREED_INTERVAL: "${FEAR_GREED_INTERVAL:-1h}"
      DEFILLAMA_ENABLED: "${DEFILLAMA_ENABLED:-0}"
      TIMEWEB_API_KEY: "${TIMEWEB_API_KEY:-}"
      TIMEWEB_AGENT_ACCESS_ID: "${TIMEWEB_AGENT_ACCESS_ID:-}"
      TIMEWEB_SUMMARY_AGENT_ACCESS_ID: "${TIMEWEB_SUMMARY_AGENT_ACCESS_ID:-}"
      TIMEWEB_BASE_URL: "${TIMEWEB_BASE_URL:-https://agent.timeweb.cloud}"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
  telegram_news_publisher:
    build:
      context: ./telegram/news-publisher
      dockerfile: Dockerfile
    container_name: telegram_news_publisher
    logging: *default-logging
    env_file:
      - ./telegram/news-publisher/.env
    environment:
      PG_DSN: "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/alerts?sslmode=disable"
      NEWS_PUBLISH_CATEGORIES: "${NEWS_PUBLISH_CATEGORIES:-crypto,macro}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Private, opt-in infrastructure bot. It receives read-only commands from
  # explicitly linked Telegram chats; never expose this profile by default.
  telegram_admin_bot:
    build:
      context: ./telegram/admin-bot
      dockerfile: Dockerfile
    container_name: crypto_telegram_admin_bot
    profiles: ["telegram-admin"]
    logging: *default-logging
    environment:
      ADMIN_BOT_TOKEN: "${ADMIN_BOT_TOKEN:-}"
      ADMIN_BOT_BOOTSTRAP_SECRET: "${ADMIN_BOT_BOOTSTRAP_SECRET:-}"
      ADMIN_BOT_ALLOWED_CHAT_IDS: "${ADMIN_BOT_ALLOWED_CHAT_IDS:-}"
      ADMIN_BOT_HOST_ROOT: "/host"
      ADMIN_BOT_HEALTH_REPORT: "/reports/server-health-latest.log"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
      - /opt/shortlong/reports:/reports:ro
      - telegram_admin_state:/state
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "0:0"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/telegram-admin-bot", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      market_history:
        condition: service_healthy

volumes:
  similarity_vectors:
  backtest_candles:
  pgdata:
  redisdata:
  marketcache:
  worker_state:
  telegram_admin_state:





