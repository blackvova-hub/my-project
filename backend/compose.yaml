      MARKET_CONSUMER_GROUP: "alert-engine-slot2"
      RULES_SLOT_FILTER: "SLOT_2"
      CONSUMER_NAME: "worker-slot2"
      LOG_LEVEL: "info"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      ALERTS_STREAM_MAXLEN: "50000"
      STREAM_READ_COUNT: "${STREAM_READ_COUNT:-10}"
      SPARSE_MAX_INSTRUMENTS: "${SPARSE_MAX_INSTRUMENTS:-20000}"
      SPARSE_SNAPSHOT_PATH: "/app/state/slot2.snapshot"
      SPARSE_SNAPSHOT_EVERY_SECONDS: "${SPARSE_SNAPSHOT_EVERY_SECONDS:-300}"
