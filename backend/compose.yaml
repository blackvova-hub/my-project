      MARKET_TYPE: "perpetual"
      GATEIO_BASE_URL: "https://api.gateio.ws"
      GATEIO_FUTURES_WS_URL: "wss://fx-ws.gateio.ws/v4/ws/usdt"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      COMPACT_REDIS_STREAM: "liquidations:v3:gateio:perpetual"
      COMPACT_RETENTION_HOURS: "${COMPACT_RETENTION_HOURS:-26}"
      PUBLISHER: "redis"
      HTTP_TIMEOUT_SECONDS: "15"
      SYMBOLS_LOAD_RETRIES: "3"
      CANDLE_SETTLE_DELAY_SECONDS: "5"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./workers/alert-engine
      dockerfile: Dockerfile
    container_name: crypto_worker
    logging: *default-logging
    environment:
      PG_DSN: "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/alerts?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      MARKET_STREAMS: "candles:v3:bybit:perpetual,candles:v3:binance:perpetual,liquidations:v3:okx:perpetual,liquidations:v3:bitget:perpetual,liquidations:v3:gateio:perpetual"
      MARKET_CONSUMER_GROUP: "alert-engine-slot1"
      RULES_SLOT_FILTER: "SLOT_1"
      LOG_LEVEL: "info"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      ALERTS_STREAM_MAXLEN: "50000"
      IMPORTANT_EVENTS_ENABLED: "1"
      STREAM_READ_COUNT: "${STREAM_READ_COUNT:-10}"
      SPARSE_MAX_INSTRUMENTS: "${SPARSE_MAX_INSTRUMENTS:-20000}"
      SPARSE_SNAPSHOT_PATH: "/app/state/slot1.snapshot"
      SPARSE_SNAPSHOT_EVERY_SECONDS: "${SPARSE_SNAPSHOT_EVERY_SECONDS:-300}"
      STREAM_MAX_DELIVERIES: "${STREAM_MAX_DELIVERIES:-5}"
      STREAM_DLQ_MAXLEN: "${STREAM_DLQ_MAXLEN:-10000}"
      STREAM_DLQ_RAW_MAX_BYTES: "${STREAM_DLQ_RAW_MAX_BYTES:-65536}"
      STREAM_DLQ_ERROR_MAX_BYTES: "${STREAM_DLQ_ERROR_MAX_BYTES:-2048}"
      ONCHAIN_ENABLED: "${ONCHAIN_ENABLED:-0}"
      ONCHAIN_MONITOR_ENABLED: "${ONCHAIN_MONITOR_ENABLED:-}"
      ONCHAIN_MIN_USD: "${ONCHAIN_MIN_USD:-1000000}"
      ETHERSCAN_API_KEY: "${ETHERSCAN_API_KEY:-}"
      ETHERSCAN_CHAIN_ID: "${ETHERSCAN_CHAIN_ID:-1}"
      ONCHAIN_BTC_ENABLED: "${ONCHAIN_BTC_ENABLED:-0}"
      BITCOIN_API_URL: "${BITCOIN_API_URL:-https://blockstream.info/api}"
      ONCHAIN_SOLANA_ENABLED: "${ONCHAIN_SOLANA_ENABLED:-0}"
      SOLANA_RPC_URL: "${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}"
      ONCHAIN_TRON_ENABLED: "${ONCHAIN_TRON_ENABLED:-0}"
      TRONGRID_BASE_URL: "${TRONGRID_BASE_URL:-https://api.trongrid.io}"
      TRONGRID_API_KEY: "${TRONGRID_API_KEY:-}"
      ONCHAIN_INTERVAL_SECONDS: "${ONCHAIN_INTERVAL_SECONDS:-60}"
      ONCHAIN_MAX_ADDRESSES: "${ONCHAIN_MAX_ADDRESSES:-500}"
      BINANCE_SPOT_BASE_URL: "https://api.binance.com"
      BYBIT_BASE_URL: "https://api.bybit.com"
      STABLECOIN_WARNING_PCT: "0.5"
      STABLECOIN_HIGH_PCT: "1.0"
      STABLECOIN_CRITICAL_PCT: "2.0"
      STABLECOIN_WARNING_MINUTES: "3"
      STABLECOIN_HIGH_MINUTES: "2"
      STABLECOIN_RECOVERY_MINUTES: "2"
      STABLECOIN_MIN_VOLUME_USD: "1000000"
    volumes:
      - worker_state:/app/state
      # если воркер читает streams / keys — добавишь нужные ENV
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

