services:
  postgres:
    ports: !override []
    volumes: !override
      - pgdata:/var/lib/postgresql/data

  redis:
    ports: !override []

  backend:
    ports: !override []
    environment:
      # LOCAL_ONLY: real backend and migrations, but HTTP cookies are allowed.
      APP_ENV: local
      CORS_ORIGIN: "http://localhost:3000"
      COOKIE_SECURE: "false"
      HSTS_MAX_AGE: "0"
      FRONTEND_URL: "http://localhost:3000"
      SKIP_MIGRATIONS: "0"
      # LOCAL_ONLY: remove this override when publishing behind HTTPS.
      TURNSTILE_ENABLED: "false"
      # LOCAL_ONLY: localhost has no public HTTPS webhook, so pull Telegram
      # updates with getUpdates. Production explicitly keeps this disabled.
      TELEGRAM_POLLING_ENABLED: "true"

  frontend:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile.local
    container_name: crypto_frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # LOCAL_PRODUCTION: this was previously scanner_shard2 on the second server.
  # Keep both Bybit shard indexes on this PC or worker coverage remains pending
  # and no Bybit alert can be evaluated.
  scanner_bybit_shard1:
    build:
      context: ./scanners/market-data
      dockerfile: Dockerfile
    container_name: crypto_scanner_bybit_shard2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EXCHANGE: "bybit"
      MARKET_TYPE: "perpetual"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      SYMBOLS_MODE: "api"
      BYBIT_CATEGORY: "linear"
      SHARD_TOTAL: "2"
      SHARD_INDEX: "1"
      PUBLISHER: "redis"
      COMPACT_REDIS_STREAM: "candles:v3:bybit:perpetual"
      COMPACT_RETENTION_HOURS: "${COMPACT_RETENTION_HOURS:-26}"
      WORKERS: "24"
      RPS: "30"
      BURST: "60"
      TRADE_LIMIT: "1000"
      OI_INTERVAL: "5min"
      ORDERBOOK_ENABLED: "0"
      HTTP_TIMEOUT_SECONDS: "15"
      SYMBOLS_LOAD_TIMEOUT_SECONDS: "40"
      SYMBOLS_LOAD_RETRIES: "3"
      RUN_TIMEOUT_SECONDS: "55"
      CANDLE_SETTLE_DELAY_SECONDS: "5"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
